<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LOTO 3D Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #viewer-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #focus-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease;
            background: radial-gradient(circle at 28% 50%, transparent 18%, rgba(6, 8, 12, 0.74) 80%);
        }
        #focus-vignette.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="viewer-container">
        <div id="focus-vignette"></div>
    </div>

    <!-- Local offline Three.js scripts served via WebViewAssetLoader -->
    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/GLTFLoader.js"></script>

    <script>
        (function () {
            const container = document.getElementById('viewer-container');

            // 1. Scene & Renderer
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);

            const camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                100
            );
            camera.position.set(4.5, 3.2, 5.5);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance'
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.08;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 2. OrbitControls (full 360° touch rotation, pinch-to-zoom, smooth damping)
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.enableRotate = true;
            controls.rotateSpeed = 0.45;
            controls.enableZoom = true;
            controls.zoomSpeed = 0.55;
            controls.enablePan = true;
            controls.minDistance = 2.6;
            controls.maxDistance = 14.0;
            controls.maxPolarAngle = Math.PI / 2 - 0.03;
            controls.touches = {
                ONE: THREE.TOUCH.ROTATE,
                TWO: THREE.TOUCH.DOLLY_PAN
            };

            // 3. Balanced 3-point lighting with directional shadows
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444850, 0.55);
            hemiLight.position.set(0, 8, 0);
            scene.add(hemiLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
            keyLight.position.set(6, 9, 7);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 1;
            keyLight.shadow.camera.far = 25;
            keyLight.shadow.camera.left = -4.5;
            keyLight.shadow.camera.right = 4.5;
            keyLight.shadow.camera.top = 4.5;
            keyLight.shadow.camera.bottom = -4.5;
            keyLight.shadow.bias = -0.0005;
            scene.add(keyLight);

            const rimLight = new THREE.DirectionalLight(0xdbeafe, 0.45);
            rimLight.position.set(-6, 5, -6);
            scene.add(rimLight);

            // Ground reference grid at y = 0 and subtle shadow-catcher plane at y = 0.001
            const gridHelper = new THREE.GridHelper(14, 28, 0x37474f, 0x22282d);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            const shadowPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(18, 14),
                new THREE.ShadowMaterial({ opacity: 0.35 })
            );
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.position.y = 0.001;
            shadowPlane.receiveShadow = true;
            scene.add(shadowPlane);

            // Group holding the currently displayed equipment model
            const equipmentGroup = new THREE.Group();
            scene.add(equipmentGroup);

            // Interactive cabinet door registry & selection state
            const focusVignette = document.getElementById('focus-vignette');
            let clickableDoors = [];
            let roofBlockerMesh = null;
            let selectedDoor = null;
            let camAnim = null;
            let previousCameraPos = null;
            let previousControlsTarget = null;
            let isApplyingLotoView = false;
            let panelAnimRefs = null;
            let lotoSeqAnim = null;

            function createPadlockMesh() {
                const group = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xDC2626, roughness: 0.35, metalness: 0.3 });
                const bandMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.5, metalness: 0.2 });
                const shackleMat = new THREE.MeshStandardMaterial({ color: 0xD1D5DB, roughness: 0.25, metalness: 0.85 });

                const body = new THREE.Mesh(new THREE.BoxGeometry(0.036, 0.042, 0.020), bodyMat);
                body.position.set(0, -0.020, 0);
                group.add(body);

                const band = new THREE.Mesh(new THREE.BoxGeometry(0.037, 0.010, 0.021), bandMat);
                band.position.set(0, -0.022, 0);
                group.add(band);

                const shackle = new THREE.Mesh(new THREE.TorusGeometry(0.012, 0.0036, 8, 18, Math.PI), shackleMat);
                shackle.position.set(0, 0.001, 0);
                group.add(shackle);

                group.visible = false;
                return group;
            }

            function createMvRotationArrow() {
                const group = new THREE.Group();
                const arcMat = new THREE.MeshBasicMaterial({ color: 0xEF4444, side: THREE.DoubleSide });
                const borderMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide });

                const outerRing = new THREE.Mesh(
                    new THREE.RingGeometry(0.052, 0.068, 24, 1, Math.PI * 0.35, Math.PI * 0.78),
                    borderMat
                );
                group.add(outerRing);

                const innerArc = new THREE.Mesh(
                    new THREE.RingGeometry(0.055, 0.065, 24, 1, Math.PI * 0.37, Math.PI * 0.74),
                    arcMat
                );
                innerArc.position.z = 0.001;
                group.add(innerArc);

                const headAngle = Math.PI * 1.13;
                const headR = 0.060;
                const head = new THREE.Mesh(new THREE.ConeGeometry(0.014, 0.028, 3), arcMat);
                head.position.set(Math.cos(headAngle) * headR, Math.sin(headAngle) * headR, 0.002);
                head.rotation.z = headAngle + Math.PI / 2;
                group.add(head);

                group.visible = false;
                return group;
            }

            function resetLotoPanelAnimation() {
                lotoSeqAnim = null;
                if (!panelAnimRefs) return;
                panelAnimRefs.keyGroup.visible = true;
                panelAnimRefs.keyGroup.position.set(
                    panelAnimRefs.keyBaseX,
                    panelAnimRefs.keyBaseY,
                    panelAnimRefs.keyBaseZ
                );
                panelAnimRefs.keyGroup.rotation.z = -0.35;

                panelAnimRefs.dcButton.position.z = panelAnimRefs.dcButtonBaseZ;
                panelAnimRefs.dcPadlock.visible = false;

                panelAnimRefs.mvSwitchGroup.rotation.z = -0.35;
                panelAnimRefs.mvRotationArrow.visible = false;
                panelAnimRefs.mvPadlock.visible = false;

                panelAnimRefs.runLedMat.color.setHex(0x22C55E);
                panelAnimRefs.runLedMat.emissive.setHex(0x22C55E);
                panelAnimRefs.runLedMat.emissiveIntensity = 0.9;

                panelAnimRefs.faultLedMat.color.setHex(0x7F1D1D);
                panelAnimRefs.faultLedMat.emissive.setHex(0xEF4444);
                panelAnimRefs.faultLedMat.emissiveIntensity = 0.12;
            }

            function saveMaterialOriginals(mat) {
                if (!mat || mat.userData._savedOrig) return;
                mat.userData._savedOrig = true;
                if (mat.color) mat.userData._origColor = mat.color.clone();
                if (mat.emissive) mat.userData._origEmissive = mat.emissive.clone();
                if (typeof mat.emissiveIntensity === 'number') {
                    mat.userData._origEmissiveIntensity = mat.emissiveIntensity;
                }
            }

            function restoreMaterialOriginals(mat) {
                if (!mat || !mat.userData._savedOrig) return;
                if (mat.color && mat.userData._origColor) mat.color.copy(mat.userData._origColor);
                if (mat.emissive && mat.userData._origEmissive) mat.emissive.copy(mat.userData._origEmissive);
                if (typeof mat.emissiveIntensity === 'number' && typeof mat.userData._origEmissiveIntensity === 'number') {
                    mat.emissiveIntensity = mat.userData._origEmissiveIntensity;
                }
            }

            function clearFocusDimming() {
                equipmentGroup.traverse(function (obj) {
                    if (!obj.isMesh || !obj.material) return;
                    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                    mats.forEach(restoreMaterialOriginals);
                });
                hemiLight.intensity = 0.55;
                keyLight.intensity = 1.15;
                rimLight.intensity = 0.45;
                if (focusVignette) focusVignette.classList.remove('active');
                selectedDoor = null;
            }

            function applyFocusDimming(activeDoor) {
                selectedDoor = activeDoor;
                hemiLight.intensity = 0.18;
                keyLight.intensity = 0.85;
                rimLight.intensity = 0.14;

                equipmentGroup.traverse(function (obj) {
                    if (!obj.isMesh || !obj.material) return;
                    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                    mats.forEach(function (mat) {
                        saveMaterialOriginals(mat);
                        if (obj === activeDoor) {
                            restoreMaterialOriginals(mat);
                            if (mat.emissive) {
                                const isGrid = activeDoor.userData && activeDoor.userData.isGridConnection;
                                mat.emissive.setHex(isGrid ? 0xEF4444 : 0x2196F3);
                                mat.emissiveIntensity = 0.36;
                            }
                        } else {
                            if (mat.color && mat.userData._origColor) {
                                mat.color.copy(mat.userData._origColor).multiplyScalar(0.28);
                            }
                            if (mat.emissive) {
                                mat.emissiveIntensity = (mat.userData._origEmissiveIntensity || 0) * 0.25;
                            }
                        }
                    });
                });

                if (focusVignette) focusVignette.classList.add('active');
            }

            // Helper: build the placeholder cube with distinct face shading and crisp edges
            function createPlaceholderCube() {
                const group = new THREE.Group();
                const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);

                const faceMaterials = [
                    new THREE.MeshStandardMaterial({ color: 0x1e88e5, roughness: 0.45, metalness: 0.15 }), // +X
                    new THREE.MeshStandardMaterial({ color: 0x1565c0, roughness: 0.45, metalness: 0.15 }), // -X
                    new THREE.MeshStandardMaterial({ color: 0x90caf9, roughness: 0.40, metalness: 0.10 }), // +Y
                    new THREE.MeshStandardMaterial({ color: 0x0d47a1, roughness: 0.55, metalness: 0.20 }), // -Y
                    new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.45, metalness: 0.15 }), // +Z
                    new THREE.MeshStandardMaterial({ color: 0x37474f, roughness: 0.50, metalness: 0.20 })  // -Z
                ];

                const cubeMesh = new THREE.Mesh(geometry, faceMaterials);
                cubeMesh.position.y = 0.75;
                cubeMesh.castShadow = true;
                cubeMesh.receiveShadow = true;
                group.add(cubeMesh);

                const edgesGeometry = new THREE.EdgesGeometry(geometry);
                const edgesMaterial = new THREE.LineBasicMaterial({
                    color: 0xe3f2fd,
                    transparent: true,
                    opacity: 0.85
                });
                const wireframe = new THREE.LineSegments(edgesGeometry, edgesMaterial);
                wireframe.position.y = 0.75;
                group.add(wireframe);

                return group;
            }

            /**
             * Builds a to-scale procedural 3D model of the HEM Gen. 2 inverter (1 unit = 1 meter).
             * Dimensions: Length (X) = 6.40m, Height (Y) = 2.03m, Depth (Z) = 2.24m.
             */
            function createHemGen2Model() {
                const root = new THREE.Group();

                // Core dimensions
                const L = 6.40;
                const W = 2.24;
                const skidH = 0.18;
                const bodyH = 1.60;
                const plenumH = 0.25;
                const totalH = skidH + bodyH + plenumH; // 2.03m

                // Vertical center coordinates (bottom of skid at y = 0.0, top of plenum at y = 2.03)
                const yBottom = 0; // 0.000
                const skidCenterY = yBottom + skidH / 2; // 0.090
                const bodyBottomY = yBottom + skidH; // 0.180
                const bodyCenterY = bodyBottomY + bodyH / 2; // 0.980
                const bodyTopY = bodyBottomY + bodyH; // 1.780
                const plenumCenterY = bodyTopY + plenumH / 2; // 1.905

                // Shared materials
                const matSkid = new THREE.MeshStandardMaterial({ color: 0x8A9096, roughness: 0.55, metalness: 0.60 });
                const matCabinet = new THREE.MeshStandardMaterial({ color: 0xD2D6DA, roughness: 0.65, metalness: 0.18 });
                const matSeam = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.75, metalness: 0.20 });
                const matLatch = new THREE.MeshStandardMaterial({ color: 0x1E1E1E, roughness: 0.50, metalness: 0.35 });
                const matVent = new THREE.MeshStandardMaterial({ color: 0x262A2E, roughness: 0.80, metalness: 0.25 });
                const matYellow = new THREE.MeshStandardMaterial({ color: 0xFBC02D, roughness: 0.40, metalness: 0.15 });
                const matRed = new THREE.MeshStandardMaterial({ color: 0xD32F2F, roughness: 0.35, metalness: 0.15 });
                const matBrass = new THREE.MeshStandardMaterial({ color: 0xC5A049, roughness: 0.35, metalness: 0.75 });
                const matGrayHandle = new THREE.MeshStandardMaterial({ color: 0x9AA0A6, roughness: 0.42, metalness: 0.35 });
                const matHandleStripe = new THREE.MeshStandardMaterial({ color: 0xC5CBD1, roughness: 0.35, metalness: 0.20 });
                const matLedWhite = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, emissive: 0xFFFFFF, emissiveIntensity: 0.55, roughness: 0.2 });
                const matLedGreen = new THREE.MeshStandardMaterial({ color: 0x4CAF50, emissive: 0x2E7D32, emissiveIntensity: 0.65, roughness: 0.2 });
                const matLedRed = new THREE.MeshStandardMaterial({ color: 0xFF5252, emissive: 0xD32F2F, emissiveIntensity: 0.65, roughness: 0.2 });
                const matDcLedGreen = new THREE.MeshStandardMaterial({ color: 0x16A34A, emissive: 0x15803D, emissiveIntensity: 0.45, roughness: 0.15, metalness: 0.1 });
                const matDcLedOff = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.35, metalness: 0.15 });

                function addBox(w, h, d, x, y, z, mat, parent = root) {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                    mesh.position.set(x, y, z);
                    parent.add(mesh);
                    return mesh;
                }

                function addClickableDoor(w, h, d, x, y, z, meta) {
                    const doorMat = new THREE.MeshStandardMaterial({
                        color: 0xD2D6DA,
                        roughness: 0.65,
                        metalness: 0.18
                    });
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), doorMat);
                    mesh.position.set(x, y, z);
                    mesh.userData = Object.assign({ isDoor: true }, meta);
                    root.add(mesh);
                    clickableDoors.push(mesh);
                    return mesh;
                }

                // 1. Galvanized steel base skid (6.40 x 0.18 x 2.24)
                addBox(L, skidH, W, 0, skidCenterY, 0, matSkid);

                // 2. Main cabinet body (6.40 x 1.60 x 2.24)
                addBox(L, bodyH, W, 0, bodyCenterY, 0, matCabinet);

                // 3. Top roof / ventilation plenum (slightly overhanging: 6.48 x 0.25 x 2.32)
                const plenumOverhang = 0.04;
                const plenumL = L + plenumOverhang * 2;
                const plenumW = W + plenumOverhang * 2;
                addBox(plenumL, plenumH, plenumW, 0, plenumCenterY, 0, matCabinet);

                // Subtle seam between skid and body, and under plenum
                addBox(L + 0.008, 0.012, W + 0.008, 0, bodyBottomY, 0, matSeam);
                addBox(L + 0.008, 0.014, W + 0.008, 0, bodyTopY, 0, matSeam);

                // Helper: vertical black latch on Z faces (+1 or -1)
                function addZLatch(x, y, zSign) {
                    const z = zSign * (W / 2 + 0.012);
                    addBox(0.032, 0.16, 0.022, x, y, z, matLatch);
                }

                // Helper: louvered vent grille on Z faces
                function addZLouverGrille(x, y, zPos, width, height, slatCount) {
                    const zDir = zPos >= 0 ? 1 : -1;
                    addBox(width, height, 0.012, x, y, zPos + zDir * 0.006, matVent);
                    const step = height / (slatCount + 1);
                    for (let s = 1; s <= slatCount; s++) {
                        const sy = y - height / 2 + s * step;
                        addBox(width - 0.04, 0.012, 0.018, x, sy, zPos + zDir * 0.012, matCabinet);
                    }
                }

                // Helper: procedural canvas texture for perforated mesh vent grille
                function createMeshGrilleTexture() {
                    const c = document.createElement('canvas');
                    c.width = 128;
                    c.height = 160;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = '#D2D6DA';
                    ctx.fillRect(0, 0, c.width, c.height);
                    ctx.fillStyle = '#1E2226';
                    const stepX = 12;
                    const stepY = 10;
                    for (let row = 0; row < c.height / stepY; row++) {
                        const offsetX = (row % 2) * (stepX / 2);
                        for (let col = -1; col < c.width / stepX + 1; col++) {
                            const cx = col * stepX + offsetX;
                            const cy = row * stepY;
                            ctx.beginPath();
                            ctx.moveTo(cx, cy - 3.5);
                            ctx.lineTo(cx + 4.5, cy);
                            ctx.lineTo(cx, cy + 3.5);
                            ctx.lineTo(cx - 4.5, cy);
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                    const tex = new THREE.CanvasTexture(c);
                    tex.encoding = THREE.sRGBEncoding;
                    return tex;
                }
                const meshGrilleMat = new THREE.MeshStandardMaterial({
                    map: createMeshGrilleTexture(),
                    roughness: 0.75,
                    metalness: 0.25
                });

                // Helper: procedural canvas texture for Bay 6 control panel labels & divider lines
                function createControlPanelOverlayTexture() {
                    const c = document.createElement('canvas');
                    c.width = 512;
                    c.height = 512;
                    const ctx = c.getContext('2d');
                    ctx.clearRect(0, 0, c.width, c.height);

                    // Subtle vertical divider lines between top row controls
                    ctx.strokeStyle = 'rgba(85, 90, 96, 0.35)';
                    ctx.lineWidth = 2;
                    [102, 204, 306, 408].forEach((lx) => {
                        ctx.beginPath();
                        ctx.moveTo(lx, 75);
                        ctx.lineTo(lx, 170);
                        ctx.stroke();
                    });
                    // Subtle vertical divider between middle/bottom columns
                    ctx.beginPath();
                    ctx.moveTo(256, 215);
                    ctx.lineTo(256, 455);
                    ctx.stroke();

                    ctx.fillStyle = '#383C42';
                    ctx.font = 'bold 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Top row labels (5 elements)
                    ctx.fillText('OFF   ON', 54, 72);
                    ctx.fillText('AC', 153, 56);
                    ctx.fillText('VOLTAGE', 153, 75);
                    ctx.fillText('RUN', 255, 72);
                    ctx.fillText('FAULT', 357, 56);
                    ctx.fillText('WARNING', 357, 75);
                    ctx.fillText('STOP', 456, 72);

                    // Middle row labels (2 elements)
                    ctx.fillText('DC', 175, 212);
                    ctx.fillText('DISCONNECT', 175, 231);
                    ctx.fillText('MV AC', 345, 212);
                    ctx.fillText('DISCONNECT', 345, 231);

                    // Bottom row labels (2 elements)
                    ctx.fillText('DISPLAY', 175, 368);
                    ctx.fillText('ETH', 345, 368);

                    const tex = new THREE.CanvasTexture(c);
                    tex.encoding = THREE.sRGBEncoding;
                    return tex;
                }

                // Helper: 3 stacked downward-angled sheet-metal louver hoods + recessed baffles
                function addStackedLouverHoods(bayX, zSign) {
                    const hoodW = 0.72;
                    const hoodOut = 0.14;
                    const hoodDrop = 0.13;
                    const baseZ = zSign * (W / 2);
                    const ys = [bodyCenterY + 0.44, bodyCenterY + 0.15, bodyCenterY - 0.14];
                    const sideCheekMat = new THREE.MeshStandardMaterial({
                        color: 0xD2D6DA,
                        roughness: 0.65,
                        metalness: 0.18,
                        side: THREE.DoubleSide
                    });

                    ys.forEach((hy) => {
                        const hoodGroup = new THREE.Group();
                        hoodGroup.position.set(bayX, hy, baseZ);

                        // Outer mounting flange frame flush on door
                        const flange = new THREE.Mesh(new THREE.BoxGeometry(hoodW + 0.05, 0.21, 0.006), matCabinet);
                        flange.position.set(0, -0.02, zSign * 0.003);
                        hoodGroup.add(flange);

                        // Recessed dark cavity
                        const cavityW = hoodW - 0.04;
                        const cavityH = 0.15;
                        const cavity = new THREE.Mesh(new THREE.BoxGeometry(cavityW, cavityH, 0.010), matVent);
                        cavity.position.set(0, -0.025, zSign * 0.007);
                        hoodGroup.add(cavity);

                        // Evenly spaced vertical rectangular divider baffles inside cavity
                        const baffleCount = 6;
                        for (let b = 0; b < baffleCount; b++) {
                            const bx = -cavityW / 2 + (b + 0.5) * (cavityW / baffleCount);
                            const baffle = new THREE.Mesh(new THREE.BoxGeometry(0.032, cavityH - 0.015, 0.022), matCabinet);
                            baffle.position.set(bx, -0.025, zSign * 0.016);
                            hoodGroup.add(baffle);
                        }

                        // Downward-angled sheet-metal hood plate
                        const slopeLen = Math.hypot(hoodOut, hoodDrop);
                        const slopeAngle = Math.atan2(hoodOut, hoodDrop); // ~0.82 rad from vertical
                        const hoodPlate = new THREE.Mesh(new THREE.BoxGeometry(hoodW, slopeLen, 0.008), matCabinet);
                        hoodPlate.position.set(0, 0.055 - hoodDrop / 2, zSign * (hoodOut / 2 + 0.006));
                        hoodPlate.rotation.x = zSign * (-slopeAngle);
                        hoodGroup.add(hoodPlate);

                        // Bottom horizontal drip lip
                        const lip = new THREE.Mesh(new THREE.BoxGeometry(hoodW, 0.008, 0.024), matCabinet);
                        lip.position.set(0, 0.055 - hoodDrop, zSign * (hoodOut + 0.012));
                        hoodGroup.add(lip);

                        // Thin triangular side flanges closing left and right sides of the hood
                        [-hoodW / 2, hoodW / 2].forEach((sx) => {
                            const triGeo = new THREE.BufferGeometry();
                            const topY = 0.055;
                            const botY = 0.055 - hoodDrop;
                            const z0 = zSign * 0.006;
                            const z1 = zSign * (hoodOut + 0.006);
                            const verts = new Float32Array([
                                sx, topY, z0,
                                sx, botY, z0,
                                sx, botY, z1
                            ]);
                            triGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                            triGeo.computeVertexNormals();
                            const cheek = new THREE.Mesh(triGeo, sideCheekMat);
                            hoodGroup.add(cheek);
                        });

                        root.add(hoodGroup);
                    });
                }

                // Helper: thin horizontal row of small rectangular slots + small perforated mesh grille below bottom hood
                function addCenterBayLowerVents(bayX, zSign) {
                    const baseZ = zSign * (W / 2);
                    const slotY = bodyCenterY - 0.31;
                    const slotCount = 6;
                    const totalSlotW = 0.64;
                    for (let s = 0; s < slotCount; s++) {
                        const sx = bayX - totalSlotW / 2 + (s + 0.5) * (totalSlotW / slotCount);
                        addBox(0.085, 0.018, 0.008, sx, slotY, baseZ + zSign * 0.004, matVent);
                    }

                        });
                        addClickableDoor(bayW - 0.016, lower30H - 0.014, 0.004, bayX, lower30CenterY, backZ - 0.001, {
                            cabinetId: '24', nameEn: 'DC Breaker / Voltage Boards', nameEs: 'Interruptor DC / Tarjetas de Voltaje', isGridConnection: false,
                            focusPoint: [bayX, lower30CenterY, backZ], focusNormal: [0, 0.06, -1], focusDist: 1.9
                        });
                        addBox(bayW - 0.03, 0.010, 0.008, bayX, split70Y, backZ - 0.004, matSeam);
                        addZLatch(latchX, upper70LatchY, -1);
                        addZLouverGrille(bayX, plenumCenterY, backPlenumZ, 0.58, 0.14, 3);
                    } else if (i === 6) {
                        // Bay 7 (rightmost): #22 Upper ("Module 6"), #25 Lower ("DC Busbar Connections")
                        addClickableDoor(bayW - 0.016, upper70H - 0.014, 0.004, bayX, upper70CenterY, backZ - 0.001, {
                            cabinetId: '22', nameEn: 'Module 6', nameEs: 'Módulo 6', isGridConnection: false,
                            focusPoint: [bayX, upper70CenterY, backZ], focusNormal: [0, 0.06, -1], focusDist: 2.1
                        });
                        addClickableDoor(bayW - 0.016, lower30H - 0.014, 0.004, bayX, lower30CenterY, backZ - 0.001, {
                            cabinetId: '25', nameEn: 'DC Busbar Connections', nameEs: 'Conexiones de Barras DC', isGridConnection: false,
                            focusPoint: [bayX, lower30CenterY, backZ], focusNormal: [0, 0.06, -1], focusDist: 1.9
                        });
                        addBox(bayW - 0.03, 0.010, 0.008, bayX, split70Y, backZ - 0.004, matSeam);
                        addZLatch(latchX, upper70LatchY, -1);
                        addZLouverGrille(bayX, plenumCenterY, backPlenumZ, 0.84, 0.14, 3);
                    }
                }

                // =========================================================
                // 3. LEFT END FACE (-X, DC Cabinet End): 3 columns split upper (#1) / lower (#2)
                // =========================================================
                const leftX = -L / 2;
                const colCount = 3;
                const colW = W / colCount;

                // Vertical column seams + horizontal split seam (~68% upper / ~32% lower)
                for (let c = 1; c < colCount; c++) {
                    const seamZ = -W / 2 + c * colW;
                    addBox(0.008, bodyH - 0.02, 0.012, leftX - 0.004, bodyCenterY, seamZ, matSeam);
                }
                addBox(0.008, 0.012, W - 0.02, leftX - 0.004, split68Y, 0, matSeam);

                const topHandleY = split68Y + upper68H * 0.68;
                const botHandleY = split68Y + upper68H * 0.25;
                const leftLatchY = (topHandleY + botHandleY) / 2; // vertical midpoint between handles

                for (let c = 0; c < colCount; c++) {
                    const colZ = -W / 2 + (c + 0.5) * colW;
                    // #1 Upper ("DU Cabinet") & #2 Lower ("Field Inputs")
                    addClickableDoor(0.004, upper68H - 0.014, colW - 0.016, leftX - 0.001, upper68CenterY, colZ, {
                        cabinetId: '1',
                        leftColIndex: c,
                        nameEn: 'DU Cabinet',
                        nameEs: 'Gabinete DU',
                        isGridConnection: false,
                        focusPoint: [leftX, upper68CenterY, colZ],
                        focusNormal: [-1, 0.06, 0],
                        focusDist: 2.15
                    });
                    addClickableDoor(0.004, lower32H - 0.014, colW - 0.016, leftX - 0.001, lower32CenterY, colZ, {
                        cabinetId: '2',
                        nameEn: 'Field Inputs',
                        nameEs: 'Entradas de Campo',
                        isGridConnection: false,
                        focusPoint: [leftX, lower32CenterY, colZ],
                        focusNormal: [-1, 0.06, 0],
                        focusDist: 1.95
                    });

                    // Black door latch on right edge of each upper door only (lower panels are clean/flat)
                    addBox(0.022, 0.14, 0.030, leftX - 0.012, leftLatchY, colZ + colW * 0.36, matLatch);

                    // 2 chunky industrial rotary pistol-grip handles per upper door
                    [topHandleY, botHandleY].forEach((hy) => {
                        const hz = colZ - 0.02;

                        // Thick circular mounting base
                        const basePlate = new THREE.Mesh(new THREE.CylinderGeometry(0.056, 0.060, 0.024, 22), matGrayHandle);
                        basePlate.rotation.z = Math.PI / 2;
                        basePlate.position.set(leftX - 0.012, hy, hz);
                        root.add(basePlate);

                        // Short horizontal neck protruding outward (-X)
                        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.028, 0.048, 16), matGrayHandle);
                        neck.rotation.z = Math.PI / 2;
                        neck.position.set(leftX - 0.042, hy, hz);
                        root.add(neck);

                        // Rounded elbow joint
                        const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.027, 14, 14), matGrayHandle);
                        elbow.position.set(leftX - 0.064, hy, hz);
                        root.add(elbow);

                        // Thick, solid, slightly tapered vertical grip pointing straight down (-Y)
                        const gripLen = 0.145;
                        const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.020, gripLen, 16), matGrayHandle);
                        grip.position.set(leftX - 0.064, hy - gripLen / 2, hz);
                        root.add(grip);

                        // Subtle light-gray front accent stripe on grip face
                        addBox(0.010, gripLen * 0.72, 0.014, leftX - 0.086, hy - gripLen * 0.45, hz, matHandleStripe);

                        // Rounded bottom tip
                        const gripTip = new THREE.Mesh(new THREE.SphereGeometry(0.020, 12, 12), matGrayHandle);
                        gripTip.position.set(leftX - 0.064, hy - gripLen, hz);
                        root.add(gripTip);
                    });

                    // 2 small circular pilot LEDs on center upper door (c === 1) to the left of upper handle
                    if (c === 1) {
                        const ledY = topHandleY + 0.005;
                        const ledZs = [colZ - 0.175, colZ - 0.125]; // left: green, right: dark gray/off
                        [matDcLedGreen, matDcLedOff].forEach((ledMat, idx) => {
                            const lz = ledZs[idx];
                            const bezel = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.010, 16), matLatch);
                            bezel.rotation.z = Math.PI / 2;
                            bezel.position.set(leftX - 0.005, ledY, lz);
                            root.add(bezel);

                            const lens = new THREE.Mesh(new THREE.SphereGeometry(0.013, 14, 14), ledMat);
                            lens.position.set(leftX - 0.010, ledY, lz);
                            root.add(lens);
                        });
                    }
                }

                // Top plenum (-X): 1 centered horizontal louvered vent grille
                const leftPlenumX = -plenumL / 2;
                addBox(0.012, 0.14, 1.10, leftPlenumX - 0.006, plenumCenterY, 0, matVent);
                for (let s = 1; s <= 3; s++) {
                    const sy = plenumCenterY - 0.07 + s * (0.14 / 4);
                    addBox(0.018, 0.012, 1.04, leftPlenumX - 0.012, sy, 0, matCabinet);
                }

                // =========================================================
                // 4. RIGHT END FACE (+X, MV End): 2 full-height double doors (#12 Left / #13 Right)
                // =========================================================
                const rightX = L / 2;
                const halfW = W / 2;
                // Left door (+Z half, adjacent to Front Bay 7): #12 ("Grid Connection (Do Not Open)")
                addClickableDoor(0.004, bodyH - 0.02, halfW - 0.016, rightX + 0.001, bodyCenterY, +W / 4, {
                    cabinetId: '12',
                    nameEn: 'Grid Connection (Do Not Open)',
                    nameEs: 'Conexión a Red (No Abrir)',
                    isGridConnection: true,
                    focusPoint: [rightX, bodyCenterY, +W / 4],
                    focusNormal: [1, 0.08, 0],
                    focusDist: 2.35
                });
                // Right door (-Z half, adjacent to Back Bay 1): #13 ("MV Switchgear")
                addClickableDoor(0.004, bodyH - 0.02, halfW - 0.016, rightX + 0.001, bodyCenterY, -W / 4, {
                    cabinetId: '13',
                    nameEn: 'MV Switchgear',
                    nameEs: 'Celda de Media Tensión',
                    isGridConnection: false,
                    focusPoint: [rightX, bodyCenterY, -W / 4],
                    focusNormal: [1, 0.08, 0],
                    focusDist: 2.35
                });
                // Center vertical seam separating the 2 full-height double doors
                addBox(0.008, bodyH - 0.02, 0.014, rightX + 0.004, bodyCenterY, 0, matSeam);
                // Centered black handles/latches
                addBox(0.024, 0.20, 0.036, rightX + 0.012, bodyCenterY, -0.09, matLatch);
                addBox(0.024, 0.20, 0.036, rightX + 0.012, bodyCenterY, +0.09, matLatch);
                // Solid top plenum (+X): no vent

                // Solid invisible roof/plenum touch blocker (prevents raycasts passing through roof onto doors behind/below)
                const blockerMat = new THREE.MeshBasicMaterial({
                    transparent: true,
                    opacity: 0,
                    depthWrite: false,
                    colorWrite: false
                });
                roofBlockerMesh = new THREE.Mesh(
                    new THREE.BoxGeometry(plenumL + 0.02, plenumH + 0.02, plenumW + 0.02),
                    blockerMat
                );
                roofBlockerMesh.position.set(0, plenumCenterY, 0);
                roofBlockerMesh.userData = { isBlocker: true };
                root.add(roofBlockerMesh);

                // Enable realistic shadow casting and receiving across all inverter meshes
                root.traverse(function (obj) {
                    if (obj.isMesh && !obj.userData.isBlocker) {
                        const isTransparent = obj.material && obj.material.transparent;
                        obj.castShadow = !isTransparent;
                        obj.receiveShadow = true;
                    }
                });

                return root;
            }

            function clearEquipmentGroup() {
                clearFocusDimming();
                clickableDoors = [];
                roofBlockerMesh = null;
                camAnim = null;
                previousCameraPos = null;
                previousControlsTarget = null;
                while (equipmentGroup.children.length > 0) {
                    const child = equipmentGroup.children[0];
                    equipmentGroup.remove(child);
                }
            }

            function getHemGen2OverviewPose(isStatusActive = false) {
                const isPortrait = camera.aspect < 1.0;
                const targetY = isStatusActive ? (isPortrait ? 0.15 : 0.35) : 1.0;
                const center = new THREE.Vector3(0, targetY, 0);
                const dir = isStatusActive
                    ? new THREE.Vector3(0.66, 0.42, 0.82).normalize()
                    : new THREE.Vector3(0.68, 0.38, 0.82).normalize();
                const fovRad = THREE.MathUtils.degToRad(camera.fov);
                const hFovRad = 2 * Math.atan(Math.tan(fovRad / 2) * camera.aspect);

                const halfWidth = 3.6;
                const halfHeight = 1.4;
                const distForWidth = halfWidth / Math.tan(hFovRad / 2);
                const distForHeight = halfHeight / Math.tan(fovRad / 2);
                const scaleFactor = isStatusActive ? (isPortrait ? 1.15 : 1.12) : 1.08;
                const distance = Math.min(Math.max(distForWidth, distForHeight, 6.8) * scaleFactor, 13.5);

                return {
                    position: center.clone().add(dir.multiplyScalar(distance)),
                    target: center
                };
            }

            /**
             * Frames the camera at a 3/4 front-right isometric angle so the full
             * 6.40m HEM Gen. 2 inverter fits cleanly on screen regardless of aspect ratio.
             */
            function frameHemGen2Camera() {
                const pose = getHemGen2OverviewPose(false);
                controls.target.copy(pose.target);
                camera.position.copy(pose.position);
                controls.minDistance = 2.6;
                controls.maxDistance = 14.0;
                controls.maxPolarAngle = Math.PI / 2 - 0.03;
                controls.update();
            }

            function framePlaceholderCamera() {
                controls.target.set(0, 0.75, 0);
                camera.position.set(2.8, 2.2, 3.2);
                controls.minDistance = 2.6;
                controls.maxDistance = 14.0;
                controls.maxPolarAngle = Math.PI / 2 - 0.03;
                controls.update();
            }

            function startCameraAnimation(toPos, toTarget, durationMs = 520) {
                camAnim = {
                    startPos: camera.position.clone(),
                    startTarget: controls.target.clone(),
                    endPos: toPos.clone(),
                    endTarget: toTarget.clone(),
                    startTime: performance.now(),
                    duration: durationMs
                };
            }

            /**
             * Smoothly animates the camera to face and zoom into the selected cabinet,
             * shifting the target slightly right so the cabinet frames cleanly on the
             * left ~56% of the screen next to the right-side LOTO info panel.
             */
            function focusOnCabinet(doorMesh) {
                const meta = doorMesh.userData;
                if (!meta || !meta.focusPoint || !meta.focusNormal) return;

                const focusPt = new THREE.Vector3().fromArray(meta.focusPoint);
                const normal = new THREE.Vector3().fromArray(meta.focusNormal).normalize();
                const fovRad = THREE.MathUtils.degToRad(camera.fov);
                const hFovRad = 2 * Math.atan(Math.tan(fovRad / 2) * camera.aspect);

                // Ensure enough distance in narrow/portrait viewports and respect minDistance = 2.6
                const baseDist = meta.focusDist || 2.6;
                const dist = Math.max(baseDist, 2.65, 1.35 / Math.tan(hFovRad / 2));

                // Right vector when looking from normal toward focusPt
                const up = new THREE.Vector3(0, 1, 0);
                const forward = normal.clone().negate();
                const rightVec = new THREE.Vector3().crossVectors(forward, up).normalize();

                // Shift camera & target right so cabinet sits on the left next to the right-side panel
                const halfSpanX = dist * Math.tan(hFovRad / 2);
                const shiftRight = rightVec.multiplyScalar(halfSpanX * 0.42);

                const endTarget = focusPt.clone().add(shiftRight);
                const endPos = endTarget.clone().add(normal.clone().multiplyScalar(dist));

                startCameraAnimation(endPos, endTarget, 520);
            }

            window.resetCameraView = function () {
                clearFocusDimming();
                if (isMultiSelectMode) {
                    updateMultiSelectVisuals();
                }
                if (previousCameraPos && previousControlsTarget) {
                    const restorePos = previousCameraPos;
                    const restoreTarget = previousControlsTarget;
                    previousCameraPos = null;
                    previousControlsTarget = null;
                    startCameraAnimation(restorePos, restoreTarget, 520);
                } else {
                    window.resetToInitialOverview();
                }
            };

            window.resetToInitialOverview = function () {
                isMultiSelectMode = false;
                multiSelectedIds.clear();
                clearFocusDimming();
                previousCameraPos = null;
                previousControlsTarget = null;
                if (currentModelFile === 'model_hem2.glb') {
                    const pose = getHemGen2OverviewPose(false);
                    startCameraAnimation(pose.position, pose.target, 520);
                } else {
                    startCameraAnimation(
                        new THREE.Vector3(2.8, 2.2, 3.2),
                        new THREE.Vector3(0, 0.75, 0),
                        450
                    );
                }
            };

            const STATUS_COLORS = {
                DEFAULT: 0xD2D6DA,
                GREEN: 0x4ADE80,
                RED: 0xF87171,
                YELLOW: 0xFACC15,
                PURPLE: 0xC084FC
            };

            function getStatusColorForDoor(statusCode, meta) {
                const id = meta.cabinetId;
                switch (statusCode) {
                    case '1A':
                        return STATUS_COLORS.RED;
                    case '2':
                        if (id === '2' || id === '6' || id === '25') return STATUS_COLORS.PURPLE;
                        return STATUS_COLORS.GREEN;
                    case '3A':
                        if (id === '1' || id === '2' || id === '6' || id === '7' || id === '12' ||
                            id === '13' || id === '14' || id === '24' || id === '25') {
                            return STATUS_COLORS.RED;
                        }
                        return STATUS_COLORS.YELLOW;
                    case '3B':
                        if (id === '1' || id === '2' || id === '6' || id === '7' || id === '12' ||
                            id === '13' || id === '14' || id === '16' || id === '24' || id === '25') {
                            return STATUS_COLORS.RED;
                        }
                        return STATUS_COLORS.GREEN;
                    case '4':
                        if (id === '1' || id === '2' || id === '6' || id === '7' || id === '24' || id === '25') {
                            return STATUS_COLORS.RED;
                        }
                        return STATUS_COLORS.GREEN;
                    case '5A':
                        if (id === '2' || id === '6' || id === '25') return STATUS_COLORS.PURPLE;
                        if (id === '12' || id === '13' || id === '14' || id === '16') {
                            return STATUS_COLORS.RED;
                        }
                        return STATUS_COLORS.GREEN;
                    case '6':
                        if (id === '1' || id === '2' || id === '6' || id === '7' || id === '9' ||
                            id === '12' || id === '13' || id === '14' || id === '18' || id === '19' ||
                            id === '24' || id === '25') {
                            return STATUS_COLORS.RED;
                        }
                        return STATUS_COLORS.YELLOW;
                    default:
                        return STATUS_COLORS.DEFAULT;
                }
            }

            window.applyLotoStatusColors = function (statusCode) {
                const code = (statusCode || '').trim();
                clearFocusDimming();
                previousCameraPos = null;
                previousControlsTarget = null;

                if (currentModelFile === 'model_hem2.glb') {
                    const pose = getHemGen2OverviewPose(code.length > 0);
                    startCameraAnimation(pose.position, pose.target, 520);
                } else {
                    window.resetToInitialOverview();
                }

                clickableDoors.forEach(function (door) {
                    const hex = getStatusColorForDoor(code, door.userData || {});
                    if (door.material && door.material.color) {
                        door.material.color.setHex(hex);
                        door.material.userData._savedOrig = true;
                        door.material.userData._origColor = door.material.color.clone();
                    }
                });
            };

            window.tintSelectedCabinetGreen = function (enable) {
                if (!selectedDoor || !selectedDoor.material) return;
                const mats = Array.isArray(selectedDoor.material) ? selectedDoor.material : [selectedDoor.material];
                const isGrid = selectedDoor.userData && selectedDoor.userData.isGridConnection;
                mats.forEach(function (mat) {
                    saveMaterialOriginals(mat);
                    if (enable) {
                        if (mat.color) mat.color.setHex(0x4ADE80);
                        if (mat.emissive) {
                            mat.emissive.setHex(0x22C55E);
                            mat.emissiveIntensity = 0.28;
                        }
                    } else {
                        restoreMaterialOriginals(mat);
                        if (mat.emissive) {
                            mat.emissive.setHex(isGrid ? 0xEF4444 : 0x2196F3);
                            mat.emissiveIntensity = 0.36;
                        }
                    }
                });
            };

            let isMultiSelectMode = false;
            let multiSelectedIds = new Set();

            function updateMultiSelectVisuals() {
                clickableDoors.forEach(function (door) {
                    if (!door.material) return;
                    const mats = Array.isArray(door.material) ? door.material : [door.material];
                    const id = String((door.userData && door.userData.cabinetId) || '');
                    const isSelected = multiSelectedIds.has(id);
                    mats.forEach(function (mat) {
                        saveMaterialOriginals(mat);
                        if (isSelected) {
                            if (mat.color) mat.color.setHex(0x4ADE80);
                            if (mat.emissive) {
                                mat.emissive.setHex(0x22C55E);
                                mat.emissiveIntensity = 0.28;
                            }
                        } else {
                            restoreMaterialOriginals(mat);
                        }
                    });
                });
            }

            window.enterMultiSelectMode = function (initialCabinetId) {
                isMultiSelectMode = true;
                multiSelectedIds = new Set(initialCabinetId ? [String(initialCabinetId)] : []);
                clickableDoors.forEach(function (door) {
                    if (door.material && door.material.color) {
                        door.material.color.setHex(STATUS_COLORS.DEFAULT);
                        door.material.userData._savedOrig = true;
                        door.material.userData._origColor = door.material.color.clone();
                    }
                });
                clearFocusDimming();
                updateMultiSelectVisuals();
                window.resetCameraView();
            };

            window.setMultiSelectedCabinets = function (idsArray) {
                multiSelectedIds = new Set((idsArray || []).map(String));
                updateMultiSelectVisuals();
            };

            window.exitMultiSelectMode = function () {
                isMultiSelectMode = false;
                multiSelectedIds.clear();
                clearFocusDimming();
            };

            // Raycaster tap detection (distinguishes short tap from drag/orbit)
            const raycaster = new THREE.Raycaster();
            const pointerNdc = new THREE.Vector2();
            let tapCandidate = null;

            renderer.domElement.addEventListener('pointerdown', function (e) {
                camAnim = null; // allow immediate user control
                if (e.isPrimary === false) {
                    tapCandidate = null;
                    return;
                }
                tapCandidate = {
                    id: e.pointerId,
                    x: e.clientX,
                    y: e.clientY,
                    time: performance.now()
                };
            });

            renderer.domElement.addEventListener('pointerup', function (e) {
                if (!tapCandidate || e.pointerId !== tapCandidate.id) return;
                const dx = e.clientX - tapCandidate.x;
                const dy = e.clientY - tapCandidate.y;
                const dt = performance.now() - tapCandidate.time;
                tapCandidate = null;

                // Only trigger cabinet selection on a clean short tap (not an orbit/zoom drag)
                if (Math.hypot(dx, dy) > 10 || dt > 350) return;
                if (isApplyingLotoView) return;
                if (clickableDoors.length === 0) return;

                const rect = renderer.domElement.getBoundingClientRect();
                pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(pointerNdc, camera);
                const targets = roofBlockerMesh ? clickableDoors.concat([roofBlockerMesh]) : clickableDoors;
                const hits = raycaster.intersectObjects(targets, false);
                if (hits.length > 0) {
                    const hitDoor = hits[0].object;
                    // Solid roof blocker intercepts clicks without selecting or highlighting anything
                    if (hitDoor === roofBlockerMesh || (hitDoor.userData && hitDoor.userData.isBlocker)) {
                        return;
                    }
                    if (!isMultiSelectMode) {
                        if (!selectedDoor) {
                            previousCameraPos = camera.position.clone();
                            previousControlsTarget = controls.target.clone();
                        }
                        applyFocusDimming(hitDoor);
                        focusOnCabinet(hitDoor);
                    }

                    const meta = hitDoor.userData || {};
                    if (window.AndroidBridge && typeof window.AndroidBridge.onCabinetSelected === 'function') {
                        window.AndroidBridge.onCabinetSelected(
                            meta.cabinetId || '',
                            meta.nameEn || '',
                            meta.nameEs || '',
                            Boolean(meta.isGridConnection)
                        );
                    }
                }
            });

            let currentModelFile = 'placeholder';

            /**
             * Loads the 3D model for the selected equipment.
             * Renders the to-scale procedural HEM Gen. 2 model for 'model_hem2.glb',
             * and keeps the placeholder cube for 'model_hem3.glb' and 'model_dcdc3.glb'.
             *
             * @param {string} fileName - e.g., "model_hem2.glb", "model_hem3.glb", "model_dcdc3.glb"
             */
            window.loadEquipmentModel = function (fileName) {
                clearEquipmentGroup();

                const targetName = fileName || 'placeholder';
                currentModelFile = targetName;

                if (targetName === 'model_hem2.glb') {
                    equipmentGroup.add(createHemGen2Model());
                    frameHemGen2Camera();
                    return;
                }

                equipmentGroup.add(createPlaceholderCube());
                framePlaceholderCamera();

                /*
                // --- Future GLTFLoader block for .glb files in app/src/main/assets/ ---
                // Served safely via WebViewAssetLoader at https://appassets.androidplatform.net/assets/
                const loader = new THREE.GLTFLoader();
                loader.load(
                    targetName,
                    function (gltf) {
                        clearEquipmentGroup();
                        const model = gltf.scene;
                        const box = new THREE.Box3().setFromObject(model);
                        const size = box.getSize(new THREE.Vector3());
                        const center = box.getCenter(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z) || 1;
                        const scale = 2.0 / maxDim;
                        model.scale.setScalar(scale);
                        model.position.sub(center.multiplyScalar(scale));
                        equipmentGroup.add(model);
                    },
                    undefined,
                    function (error) {
                        console.error('Error loading GLB model:', error);
                        clearEquipmentGroup();
                        equipmentGroup.add(createPlaceholderCube());
                    }
                );
                */
            };

            // Initialize with query param (?model=...) if present
            const params = new URLSearchParams(window.location.search);
            const initialModel = params.get('model') || 'placeholder';
            window.loadEquipmentModel(initialModel);

            // Handle window/orientation resize
            window.addEventListener('resize', function () {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (currentModelFile === 'model_hem2.glb' && !selectedDoor) {
                    frameHemGen2Camera();
                }
            });

            // Solid collision safety box around HEM Gen. 2 (enclosure + 0.45m buffer)
            const SAFE_MIN_X = -3.65;
            const SAFE_MAX_X = 3.65;
            const SAFE_MAX_Y = 2.48;
            const SAFE_MIN_Z = -1.57;
            const SAFE_MAX_Z = 1.57;

            function enforceSolidCameraBounds() {
                if (camera.position.y < 0.08) {
                    camera.position.y = 0.08;
                }
                if (currentModelFile !== 'model_hem2.glb') return;

                const px = camera.position.x;
                const py = camera.position.y;
                const pz = camera.position.z;

                if (
                    px > SAFE_MIN_X && px < SAFE_MAX_X &&
                    py < SAFE_MAX_Y &&
                    pz > SAFE_MIN_Z && pz < SAFE_MAX_Z
                ) {
                    const dPosX = SAFE_MAX_X - px;
                    const dNegX = px - SAFE_MIN_X;
                    const dPosY = SAFE_MAX_Y - py;
                    const dPosZ = SAFE_MAX_Z - pz;
                    const dNegZ = pz - SAFE_MIN_Z;

                    const minPen = Math.min(dPosX, dNegX, dPosY, dPosZ, dNegZ);
                    if (minPen === dPosX) {
                        camera.position.x = SAFE_MAX_X;
                    } else if (minPen === dNegX) {
                        camera.position.x = SAFE_MIN_X;
                    } else if (minPen === dPosY) {
                        camera.position.y = SAFE_MAX_Y;
                    } else if (minPen === dPosZ) {
                        camera.position.z = SAFE_MAX_Z;
                    } else {
                        camera.position.z = SAFE_MIN_Z;
                    }
                }
            }

            window.startApplyLotoView = function (statusCode) {
                const code = (statusCode || '').trim();
                isApplyingLotoView = true;
                isMultiSelectMode = false;
                multiSelectedIds.clear();
                clearFocusDimming();
                resetLotoPanelAnimation();

                clickableDoors.forEach(function (door) {
                    const hex = getStatusColorForDoor(code, door.userData || {});
                    if (door.material && door.material.color) {
                        door.material.color.setHex(hex);
                        door.material.userData._savedOrig = true;
                        door.material.userData._origColor = door.material.color.clone();
                    }
                });

                const centralDoor = clickableDoors.find(function (d) {
                    return d.userData && d.userData.cabinetId === '11';
                });
                if (centralDoor && panelAnimRefs) {
                    controls.minDistance = 1.15;
                    const focusPt = new THREE.Vector3(
                        panelAnimRefs.dcButton.position.x + 0.10,
                        panelAnimRefs.dcButton.position.y + 0.04,
                        W / 2
                    );
                    const normal = new THREE.Vector3(0, 0.04, 1).normalize();
                    const fovRad = THREE.MathUtils.degToRad(camera.fov);
                    const hFovRad = 2 * Math.atan(Math.tan(fovRad / 2) * camera.aspect);
                    const dist = Math.max(1.30, 0.68 / Math.tan(hFovRad / 2));
                    const up = new THREE.Vector3(0, 1, 0);
                    const rightVec = new THREE.Vector3().crossVectors(normal.clone().negate(), up).normalize();
                    const halfSpanX = dist * Math.tan(hFovRad / 2);
                    const endTarget = focusPt.clone().add(rightVec.multiplyScalar(halfSpanX * 0.44));
                    const endPos = endTarget.clone().add(normal.multiplyScalar(dist));
                    startCameraAnimation(endPos, endTarget, 550);
                }
            };

            window.exitApplyLotoView = function () {
                isApplyingLotoView = false;
                controls.minDistance = 2.6;
                resetLotoPanelAnimation();
                clickableDoors.forEach(function (door) {
                    if (door.material && door.material.color) {
                        door.material.color.setHex(STATUS_COLORS.DEFAULT);
                        door.material.userData._savedOrig = true;
                        door.material.userData._origColor = door.material.color.clone();
                    }
                });
                clearFocusDimming();
                window.resetToInitialOverview();
            };

            window.playLotoLockSequence = function () {
                resetLotoPanelAnimation();
                lotoSeqAnim = {
                    startTime: performance.now(),
                    duration: 4500
                };
            };

            // Render loop
            function animate() {
                requestAnimationFrame(animate);
                if (camAnim) {
                    const elapsed = performance.now() - camAnim.startTime;
                    const t = Math.min(elapsed / camAnim.duration, 1);
                    const ease = 1 - Math.pow(1 - t, 3); // cubic ease-out
                    camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
                    controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
                    if (t >= 1) {
                        camAnim = null;
                    }
                }
                if (lotoSeqAnim && panelAnimRefs) {
                    const elapsed = performance.now() - lotoSeqAnim.startTime;
                    const p = Math.min(elapsed / lotoSeqAnim.duration, 1);

                    // Step 1 (0.00 -> 0.30): Rotate key to OFF (left) and slide out (NO padlock)
                    if (p <= 0.14) {
                        const k = p / 0.14;
                        panelAnimRefs.keyGroup.visible = true;
                        panelAnimRefs.keyGroup.rotation.z = -0.35 + (0.90 * k);
                        panelAnimRefs.keyGroup.position.z = panelAnimRefs.keyBaseZ;
                    } else if (p <= 0.28) {
                        const k = (p - 0.14) / 0.14;
                        panelAnimRefs.keyGroup.visible = true;
                        panelAnimRefs.keyGroup.rotation.z = 0.55;
                        panelAnimRefs.keyGroup.position.z = panelAnimRefs.keyBaseZ + (0.12 * k);
                    } else {
                        panelAnimRefs.keyGroup.visible = false;
                    }

                    // Step 2 (0.30 -> 0.62): Depress DC DISCONNECT and latch Padlock #1
                    if (p >= 0.30 && p <= 0.44) {
                        const k = (p - 0.30) / 0.14;
                        panelAnimRefs.dcButton.position.z = panelAnimRefs.dcButtonBaseZ - (0.008 * k);
                    } else if (p > 0.44) {
                        panelAnimRefs.dcButton.position.z = panelAnimRefs.dcButtonBaseZ - 0.008;
                    }
                    if (p >= 0.44) {
                        const k = Math.min((p - 0.44) / 0.16, 1);
                        panelAnimRefs.dcPadlock.visible = true;
                        panelAnimRefs.dcPadlock.position.y = panelAnimRefs.dcPadlockTargetY + (0.05 * (1 - k));
                    }

                    // Step 3 (0.62 -> 0.96): Show curved rotation arrow, turn MV DISCONNECT left to OFF, latch Padlock #2
                    if (p >= 0.62 && p < 0.80) {
                        const k = (p - 0.62) / 0.18;
                        panelAnimRefs.mvRotationArrow.visible = true;
                        panelAnimRefs.mvSwitchGroup.rotation.z = -0.35 + (1.30 * k);
                    } else if (p >= 0.80) {
                        panelAnimRefs.mvRotationArrow.visible = false;
                        panelAnimRefs.mvSwitchGroup.rotation.z = 0.95;
                        const k = Math.min((p - 0.80) / 0.16, 1);
                        panelAnimRefs.mvPadlock.visible = true;
                        panelAnimRefs.mvPadlock.position.y = panelAnimRefs.mvPadlockTargetY + (0.05 * (1 - k));
                    }

                    // Indicator LEDs (0.82 -> 1.00): RUN off, FAULT/WARNING on
                    if (p >= 0.82) {
                        const k = Math.min((p - 0.82) / 0.18, 1);
                        panelAnimRefs.runLedMat.emissiveIntensity = 0.9 * (1 - k) + 0.06;
                        panelAnimRefs.faultLedMat.emissiveIntensity = 0.12 + (1.03 * k);
                        if (k > 0.5) {
                            panelAnimRefs.runLedMat.color.setHex(0x1B3A24);
                            panelAnimRefs.faultLedMat.color.setHex(0xEF4444);
                        }
                    }

                    if (p >= 1) {
                        lotoSeqAnim = null;
                        if (window.AndroidBridge && typeof window.AndroidBridge.onLotoSequenceCompleted === 'function') {
                            window.AndroidBridge.onLotoSequenceCompleted();
                        }
                    }
                }
                controls.update();
                enforceSolidCameraBounds();
                renderer.render(scene, camera);
            }
            animate();
        })();
    </script>
</body>
</html>
